<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Åstorp Taekwondo - Sponsor Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
    <style>
        /* Tokens mirror the web-v4 marketing site (basecoat/shadcn light theme):
           near-white background, near-black foreground, soft zinc borders, a single
           emerald accent. The card and badges stay on a light surface in both color
           schemes because Apple's black and Google's #1F1F1F badges need it. */
        :root {
            color-scheme: light;
            --accent: #b91c1c;
            --background: #fbfbfb;
            --foreground: #1c1c1c;
            --muted-foreground: #71717a;
            --border: #e6e6e7;
            --muted: #f6f6f6;
            --card: #ffffff;
            --emerald: #10b981;
            --radius: 0.75rem;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem 1.25rem;
            background: var(--background);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 0.25rem);
            padding: 2.25rem 1.75rem;
            width: 100%;
            max-width: 22rem;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 30px rgba(0, 0, 0, .05);
        }

        /* Logo sits in a subtle ring tinted with the pass accent. */
        .logo-wrap {
            width: 60px;
            height: 60px;
            margin: -4rem auto 1rem;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--muted);
            box-shadow: inset 0 0 0 1px var(--border), 0 0 0 4px color-mix(in srgb, var(--accent) 8%, transparent);
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.2;
            margin: 0 0 .35rem;
        }

        .sub {
            margin: 0 0 1.75rem;
            font-size: .9rem;
            line-height: 1.5;
            color: var(--muted-foreground);
        }

        /* QR — desktop only (shown by JS when not on a phone). */
        .qr {
            display: none;
            margin: 0 0 1.75rem;
        }

        .qr-frame {
            width: 184px;
            margin: 0 auto;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .qr svg, .qr img {
            width: 160px;
            height: 160px;
            display: block;
            margin: 0 auto;
        }

        .qr p {
            font-size: .82rem;
            line-height: 1.4;
            color: var(--muted-foreground);
            margin: .85rem 0 0;
        }

        /* Buttons — both badges share one column width so their edges line up. */
        .badges {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: .75rem;
            width: 100%;
            max-width: 10rem;
            margin: 0 auto;
        }

        .badge {
            display: block;
            width: 100%;
            text-decoration: none;
            transition: transform .1s ease, opacity .2s ease;
        }

        .badge:active {
            transform: scale(.97);
        }

        /* Clip the image box to the badge's own corner radius so a dimmed badge does
           not show a faint square bounding box at the rounded corners. */
        .badge img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        /* Google's official lockup carries more internal padding than Apple's, so at
           equal width its content reads smaller. Zoom the (vector) badge a touch and
           clip the excess padding so the two lockups match in weight. Crisp, no seam:
           the crop lands in the badge's solid fill, re-rounded by the anchor. */
        .badge.gw {
            overflow: hidden;
            border-radius: 8px;
            background: #1F1F1F;
        }

        .badge.gw img {
            transform: scale(1.16);
        }

        .badge.fallback {
            display: flex;
            height: 48px;
            align-items: center;
            justify-content: center;
            padding: 0 1.25rem;
            background: #000;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            font-size: .95rem;
        }

        .badge.dim {
            opacity: .35;
        }

        /* Subtle developer-oriented attribution: signals the page is API-generated. */
        .powered {
            font-size: .72rem;
            color: var(--muted-foreground);
            text-align: center;
        }

        .powered a {
            color: var(--muted-foreground);
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }

        .powered a:hover {
            color: var(--foreground);
            border-color: var(--muted-foreground);
        }
    </style>
</head>

        // On a phone: emphasize the matching wallet, dim the other.
        if (phone) {
            var els = document.querySelectorAll('.badge');
            for (var i = 0; i < els.length; i++) {
                var p = els[i].getAttribute('data-platform');
                if ((ios && p !== 'ios') || (android && p !== 'android')) els[i].className += ' dim';
            }
        } else {
            // On desktop: render a QR of THIS page so the visitor can open it on a phone.
            try {
                var qr = qrcode(0, 'M');

                document.getElementById('qrcode').innerHTML = qr.createSvgTag({cellSize: 5, margin: 2, scalable: true});
                document.getElementById('qr').style.display = 'block';
            } catch (e) { /* plugin failed to load: just show the buttons */
