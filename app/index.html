<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Åstorp Taekwondo Pass</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#AA3024">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Taekwondo">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --wallet-red: #AA3024; 
      --white: #ffffff;
      --card-radius: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f0f0f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    /* Wallet-kortet */
    .card {
      background-color: var(--wallet-red);
      border-radius: var(--card-radius);
      width: 100%;
      max-width: 400px;
      padding: 35px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .header h1 {
      color: var(--white);
      font-size: 1.5rem;
      font-weight: 500;
    }

    .info-section {
      text-align: left;
      margin-bottom: 40px;
    }

    .label {
      color: var(--white);
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .value {
      color: var(--white);
      font-size: 3.5rem;
      font-weight: 400;
      line-height: 1;
    }

    .barcode-container {
      text-align: center;
      width: 100%;
    }

    .barcode-white-box {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .barcode-white-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .barcode-number {
      color: var(--white);
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    /* INSTALLATIONS-GUIDE (Popup längst ner) */
    #install-banner {
      display: none; /* Dold som standard, visas via JS */
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
      z-index: 100;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .banner-content {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .banner-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
    }

    .install-button {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Specifik stil för iPhone-instruktion */
    .ios-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>') no-repeat center;
      vertical-align: middle;
      margin: 0 5px;
    }

    /* Dölj guiden om appen redan är installerad */
    @media (display-mode: standalone) {
      #install-banner { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="logo.png" alt="Logo">
      <h1>Åstorp Taekwondo</h1>
    </div>

    <div class="info-section">
      <div class="label">ONLINEKOD</div>
      <div class="value">58005</div>
    </div>

    <div class="barcode-container">
      <div class="barcode-white-box">
        <img src="barcode.png" alt="Barcode">
      </div>
      <div class="barcode-number">58005</div>
    </div>
  </div>

  <div id="install-banner">
    <div class="banner-content">
      <div class="banner-text" id="banner-instruction">
        Vill du spara passet som en app?
      </div>
      <button id="android-install-btn" class="install-button" style="display:none;">Installera</button>
    </div>
  </div>

  <script>
    const banner = document.getElementById('install-banner');
    const instructionText = document.getElementById('banner-instruction');
    const androidBtn = document.getElementById('android-install-btn');

    // 1. Kolla om det är iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone) {
      if (isIOS) {
        // Visa iPhone-instruktion
        banner.style.display = 'block';
        instructionText.innerHTML = 'Spara som app: Tryck på <span class="ios-icon"></span> och välj <strong>"Lägg till på hemskärmen"</strong>.';
      } else {
        // För Android/Chrome - lyssna efter installations-prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          banner.style.display = 'block';
          androidBtn.style.display = 'block';
        });

        androidBtn.addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') banner.style.display = 'none';
          });
        });
      }
    }

    // Registrera Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

</body>
</html>
