<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Åstorp Taekwondo Pass</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#AA3024">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Taekwondo">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      /* The specific deep red from your image */
      --wallet-red: #AA3024; 
      --white: #ffffff;
      --card-radius: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f0f0f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--wallet-red);
      border-radius: var(--card-radius);
      width: 100%;
      max-width: 400px;
      padding: 35px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    /* Top Logo and Name */
    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .header img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white; /* Fallback if logo is transparent */
    }

    .header h1 {
      color: var(--white);
      font-size: 1.5rem;
      font-weight: 500;
    }

    /* Onlinekod section - Now updated to match image */
    .info-section {
      text-align: left;
      margin-bottom: 40px;
    }

    .label {
      color: var(--white);
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .value {
      color: var(--white);
      font-size: 3.5rem; /* Large text as seen in image */
      font-weight: 400;
      line-height: 1;
    }

    /* Barcode Section */
    .barcode-container {
      text-align: center;
      width: 100%;
    }

    .barcode-white-box {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .barcode-white-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .barcode-number {
      color: var(--white);
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    /* Instructions for first-time users */
    .install-hint {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
      max-width: 300px;
    }

    /* Hide instructions once installed */
    @media (display-mode: standalone) {
      .install-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="logo.png" alt="Logo">
      <h1>Åstorp Taekwondo</h1>
    </div>

    <div class="info-section">
      <div class="label">ONLINEKOD</div>
      <div class="value">58005</div>
    </div>

    <div class="barcode-container">
      <div class="barcode-white-box">
        <img src="barcode.png" alt="Barcode">
      </div>
      <div class="barcode-number">58005</div>
    </div>
  </div>

  <div class="install-hint" id="hint">
    <strong>För smidig åtkomst:</strong><br>
    Tryck på <span style="color:#007aff">Dela</span> och välj <strong>"Lägg till på hemskärmen"</strong>.
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
    
    // Hide hint if already installed on iOS
    if (window.navigator.standalone === true) {
      document.getElementById('hint').style.display = 'none';
    }
  </script>

</body>
</html>
