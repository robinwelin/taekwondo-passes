<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Club Member Pass</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Member Pass">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
      padding: 30px 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.4rem;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 0.9rem;
      color: #666666;
      margin-bottom: 24px;
    }
    .barcode-container {
      background: #ffffff;
      padding: 16px;
      border: 1px solid #e1e1e6;
      border-radius: 8px;
      display: inline-block;
      width: 100%;
      margin-bottom: 24px;
    }
    .barcode-container img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .instructions {
      font-size: 0.85rem;
      color: #8a8a8f;
      line-height: 1.4;
      border-top: 1px solid #eeeeee;
      padding-top: 16px;
    }
    /* Hidden by default on standalone PWA installation */
    @media (display-mode: standalone) {
      .instructions {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Club Entry Pass</h1>
      <p>Scan at the reader</p>
    </div>

    <div class="barcode-container">
      <!-- Replace with your actual barcode image filename -->
      <img src="barcode.png" alt="Membership Barcode">
    </div>

    <div class="instructions" id="ios-instruction">
      To save this to your phone:<br>
      Tap <strong style="color: #007aff;">Share</strong> (bottom menu) then select <strong>'Add to Home Screen'</strong>.
    </div>
  </div>

  <script>
    // Register the service worker for offline capability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered successfully.', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // Hide instructions on iOS if already running as an installed PWA
    if (window.navigator.standalone === true) {
      document.getElementById('ios-instruction').style.display = 'none';
    }
  </script>

</body>
</html>
